<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>הנדל״ן שלנו</title>
<style>
:root{--bg:#05070e;--card:rgba(14,20,36,.7);--ink:#e7f0ff;--muted:#8796b3;--line:rgba(120,170,255,.18);--accent:#3ee6ff;--bad:#ff5c8a;color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--ink);font-family:system-ui,'Segoe UI',Arial,sans-serif;padding:16px;box-sizing:border-box;
background:radial-gradient(700px 500px at 100% 0%,rgba(62,230,255,.16),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(155,107,255,.18),transparent 60%),linear-gradient(rgba(120,170,255,.05) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(120,170,255,.05) 1px,transparent 1px) 0 0/44px 44px,var(--bg)}
form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 26px;width:100%;max-width:360px;display:grid;gap:14px;backdrop-filter:blur(14px);box-shadow:0 0 60px -20px rgba(62,230,255,.5),inset 0 1px 0 rgba(255,255,255,.06)}
h1{margin:0;font-size:22px;background:linear-gradient(90deg,#fff,#9fefff,#b998ff);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;color:var(--muted);font-size:14px}
input{font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(5,7,14,.8);color:var(--ink);direction:ltr;text-align:left}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(62,230,255,.15)}
button{font:inherit;font-size:15px;font-weight:700;padding:11px;border:0;border-radius:10px;background:linear-gradient(135deg,#3ee6ff,#7aa8ff);color:#04121a;cursor:pointer;box-shadow:0 0 24px -6px rgba(62,230,255,.8)}
button:focus{outline:2px solid #fff;outline-offset:2px}
#msg{color:var(--bad);font-size:14px;min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>הנדל״ן שלנו</h1>
  <p>העמוד מוצפן. הזיני סיסמה כדי לפתוח.</p>
  <input type="text" name="username" value="nadlan" autocomplete="username" hidden>
  <input id="pw" type="password" autocomplete="current-password" placeholder="סיסמה" required autofocus>
  <button id="go" type="submit">פתיחה</button>
  <div id="msg" role="alert"></div>
</form>

document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const msg=document.getElementById('msg'), go=document.getElementById('go');
  msg.textContent=''; go.disabled=true; go.textContent='פותח…';
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);

    msg.textContent='סיסמה שגויה. נסי שוב.'; go.disabled=false; go.textContent='פתיחה';
