<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ההון שלנו</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2430;--muted:#6b7280;--line:#e5e1d8;--accent:#0f6e74;--bad:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#11161d;--card:#1a212b;--ink:#e8ecf1;--muted:#9aa4b2;--line:#2a3340;--accent:#4fb3b9;--bad:#fb923c;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,'Segoe UI',Arial,sans-serif;padding:16px;box-sizing:border-box}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:100%;max-width:360px;display:grid;gap:12px}
h1{margin:0;font-size:20px}
p{margin:0;color:var(--muted);font-size:14px}
input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
input:focus,button:focus{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-size:15px;font-weight:700;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
#msg{color:var(--bad);font-size:14px;min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>ההון שלנו</h1>
  <p>העמוד מוצפן. הזיני סיסמה כדי לפתוח.</p>
  <input type="text" name="username" value="nadlan" autocomplete="username" hidden>
  <input id="pw" type="password" autocomplete="current-password" placeholder="סיסמה" required autofocus>
  <button id="go" type="submit">פתיחה</button>
  <div id="msg" role="alert"></div>
</form>

document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const msg=document.getElementById('msg'), go=document.getElementById('go');
  msg.textContent=''; go.disabled=true; go.textContent='פותח…';
  try{
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(ENC.s),iterations:ENC.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);

    const html=new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  }catch(err){
    msg.textContent='סיסמה שגויה. נסי שוב.'; go.disabled=false; go.textContent='פתיחה';

});
